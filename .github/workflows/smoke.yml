name: Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build CLI
        run: cargo build -p devcontainer-cli

      - name: Bring up devcontainer
        run: cargo run -p devcontainer-cli -- up --skip-post-create --skip-post-attach

      - name: Execute dummy command in devcontainer
        run: cargo run -p devcontainer-cli -- exec -- echo "hello from devcontainer"

      - name: Final devcontainer cleanup
        if: always()
        run: cargo run -p devcontainer-cli -- down --remove-volumes --remove-unknown

  smoke-test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build CLI
        run: cargo build -p devcontainer-cli

      - name: Check CLI version
        run: cargo run -p devcontainer-cli -- version
